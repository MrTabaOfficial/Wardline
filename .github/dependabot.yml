version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      firebase:
        patterns: ["com.google.firebase*", "com.google.gms*"]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /firestore-tests
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
